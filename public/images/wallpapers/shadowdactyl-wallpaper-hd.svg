<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0015;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0015;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="2400" height="1600" fill="url(#bgGradient)"/>
  <circle cx="1200" cy="600" r="800" fill="url(#pulseGlow)"/>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="2400" height="1600" fill="url(#grid)"/>
  <g transform="translate(1200, 550)">
    <ellipse cx="-300" cy="50" rx="280" ry="420" fill="#7c3aed" opacity="0.85" transform="rotate(-40 -300 50)" filter="url(#glow)"/>
    <path d="M -250 -150 Q -320 0 -340 200 Q -335 280 -250 240 Q -180 180 -150 80" fill="#a855f7" opacity="0.7"/>
    <ellipse cx="300" cy="50" rx="280" ry="420" fill="#7c3aed" opacity="0.85" transform="rotate(40 300 50)" filter="url(#glow)"/>
    <path d="M 250 -150 Q 320 0 340 200 Q 335 280 250 240 Q 180 180 150 80" fill="#a855f7" opacity="0.7"/>
    <g>
      <ellipse cx="0" cy="-180" rx="240" ry="300" fill="#1a0a2e" stroke="#7c3aed" stroke-width="5" filter="url(#glow)"/>
      <ellipse cx="0" cy="-20" rx="160" ry="140" fill="#2d1555" stroke="#9333ea" stroke-width="3"/>
      <path d="M -120 -380 Q -150 -450 -180 -550 Q -190 -580 -160 -480 Q -120 -380 -90 -280" fill="#7c3aed" stroke="#4c1d95" stroke-width="4"/>
      <path d="M 120 -380 Q 150 -450 180 -550 Q 190 -580 160 -480 Q 120 -380 90 -280" fill="#7c3aed" stroke="#4c1d95" stroke-width="4"/>
      <path d="M -60 -420 Q -80 -500 -90 -600" stroke="#9333ea" stroke-width="3" fill="none"/>
      <path d="M 60 -420 Q 80 -500 90 -600" stroke="#9333ea" stroke-width="3" fill="none"/>
      <path d="M -30 -450 Q -35 -530 -20 -630" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 30 -450 Q 35 -530 20 -630" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.7"/>
      <circle cx="-80" cy="-200" r="40" fill="#9333ea" stroke="#ffffff" stroke-width="3"/>
      <circle cx="80" cy="-200" r="40" fill="#9333ea" stroke="#ffffff" stroke-width="3"/>
      <circle cx="-75" cy="-210" r="18" fill="#ff00ff" opacity="0.9"/>
      <circle cx="85" cy="-210" r="18" fill="#ff00ff" opacity="0.9"/>
      <circle cx="-70" cy="-205" r="6" fill="#ffffff"/>
      <circle cx="90" cy="-205" r="6" fill="#ffffff"/>
    </g>
    <g transform="translate(0, 120)">
      <polygon points="0,-180 210,-105 210,105 0,180 -210,105 -210,-105" fill="#2d2d2d" stroke="#7c3aed" stroke-width="5" filter="url(#glow)"/>
      <polygon points="0,-170 200,-100 200,100 0,170 -200,100 -200,-100" fill="#ffffff" opacity="0.06"/>
      <polygon points="200,-100 200,100 0,170 0,-170" fill="#ffffff" opacity="0.08"/>
      <polygon points="-200,-100 -200,100 0,170 0,-170" fill="#000000" opacity="0.15"/>
      <text x="-60" y="80" font-family="Arial, sans-serif" font-size="200" font-weight="900" fill="#9333ea" text-anchor="middle" letter-spacing="4" filter="url(#glow)">S</text>
      <text x="80" y="80" font-family="Arial, sans-serif" font-size="200" font-weight="900" fill="#e9d5ff" text-anchor="middle" letter-spacing="4" opacity="0.95">D</text>
    </g>
  </g>
  <text x="1200" y="1250" font-family="Arial, sans-serif" font-size="180" font-weight="900" text-anchor="middle" fill="#9333ea" letter-spacing="8" filter="url(#glow)">SHADOW</text>
  <text x="1200" y="1250" font-family="Arial, sans-serif" font-size="180" font-weight="900" text-anchor="middle" fill="#e9d5ff" opacity="0.7" letter-spacing="8" dx="900">DACTYL</text>
  <text x="1200" y="1380" font-family="Arial, sans-serif" font-size="56" text-anchor="middle" fill="#c084fc" letter-spacing="6" font-weight="600">POWER · CONTROL · FREEDOM</text>
  <line x1="700" y1="1420" x2="950" y2="1420" stroke="#9333ea" stroke-width="4" opacity="0.6"/>
  <line x1="1450" y1="1420" x2="1700" y2="1420" stroke="#9333ea" stroke-width="4" opacity="0.6"/>
  <rect x="60" y="60" width="200" height="200" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.3"/>
  <rect x="2140" y="60" width="200" height="200" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.3"/>
  <rect x="60" y="1340" width="200" height="200" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.3"/>
  <rect x="2140" y="1340" width="200" height="200" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.3"/>
</svg>